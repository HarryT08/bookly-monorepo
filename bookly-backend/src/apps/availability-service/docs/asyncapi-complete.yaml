asyncapi: 3.0.0
info:
  title: Bookly Availability Service Events
  version: 2.0.0
  description: |
    # Bookly Availability Service - Event-Driven Architecture
    
    Complete event specification for the Availability Service covering all implemented RFs.
    
    ## Event Categories
    
    ### RF-07: Availability and Schedule Events
    - Availability creation, modification, and deletion
    - Schedule management and conflict detection
    - Reservation lifecycle events
    
    ### RF-08: Calendar Integration Events
    - Calendar synchronization events
    - External calendar conflict detection
    - Integration status updates
    
    ### RF-10: Calendar View Events
    - View refresh triggers
    - Real-time calendar updates
    
    ### RF-11: Audit and History Events
    - Complete audit trail events
    - History entry creation
    - Analytics and reporting triggers
    
    ## Event Flow Patterns
    
    ### Reservation Creation Flow
    1. `reservation.creation.requested` → Validation
    2. `reservation.validation.completed` → Conflict Check
    3. `reservation.conflict.detected` OR `reservation.approved`
    4. `reservation.created` → History Logging
    5. `reservation.history.created` → Notifications
    
    ### Calendar Sync Flow
    1. `calendar.sync.initiated` → External API Call
    2. `calendar.events.fetched` → Conflict Detection
    3. `calendar.conflicts.detected` → Resolution
    4. `calendar.sync.completed` → Update Local Data
    
  contact:
    name: Bookly Development Team
    email: dev@bookly.ufps.edu.co
  license:
    name: MIT

defaultContentType: application/json

channels:
  # RF-07: Availability and Schedule Events
  availability/created:
    address: availability.created
    description: Triggered when new availability is created
    messages:
      availabilityCreated:
        $ref: '#/components/messages/AvailabilityCreated'
  
  availability/updated:
    address: availability.updated
    description: Triggered when availability is modified
    messages:
      availabilityUpdated:
        $ref: '#/components/messages/AvailabilityUpdated'
  
  schedule/created:
    address: schedule.created
    description: Triggered when complex schedule is created
    messages:
      scheduleCreated:
        $ref: '#/components/messages/ScheduleCreated'
  
  reservation/created:
    address: reservation.created
    description: Triggered when reservation is successfully created
    messages:
      reservationCreated:
        $ref: '#/components/messages/ReservationCreated'
  
  reservation/conflict:
    address: reservation.conflict.detected
    description: Triggered when reservation conflict is detected
    messages:
      reservationConflict:
        $ref: '#/components/messages/ReservationConflict'
  
  reservation/approved:
    address: reservation.approved
    description: Triggered when reservation is approved
    messages:
      reservationApproved:
        $ref: '#/components/messages/ReservationApproved'
  
  reservation/cancelled:
    address: reservation.cancelled
    description: Triggered when reservation is cancelled
    messages:
      reservationCancelled:
        $ref: '#/components/messages/ReservationCancelled'
  
  # RF-08: Calendar Integration Events
  calendar/integration/created:
    address: calendar.integration.created
    description: Triggered when calendar integration is established
    messages:
      calendarIntegrationCreated:
        $ref: '#/components/messages/CalendarIntegrationCreated'
  
  calendar/sync/initiated:
    address: calendar.sync.initiated
    description: Triggered when calendar sync process starts
    messages:
      calendarSyncInitiated:
        $ref: '#/components/messages/CalendarSyncInitiated'
  
  calendar/sync/completed:
    address: calendar.sync.completed
    description: Triggered when calendar sync process completes
    messages:
      calendarSyncCompleted:
        $ref: '#/components/messages/CalendarSyncCompleted'
  
  calendar/sync/failed:
    address: calendar.sync.failed
    description: Triggered when calendar sync process fails
    messages:
      calendarSyncFailed:
        $ref: '#/components/messages/CalendarSyncFailed'
  
  calendar/conflicts/detected:
    address: calendar.conflicts.detected
    description: Triggered when conflicts are found during sync
    messages:
      calendarConflictsDetected:
        $ref: '#/components/messages/CalendarConflictsDetected'
  
  # RF-10: Calendar View Events
  calendar/view/requested:
    address: calendar.view.requested
    description: Triggered when calendar view is requested
    messages:
      calendarViewRequested:
        $ref: '#/components/messages/CalendarViewRequested'
  
  calendar/view/updated:
    address: calendar.view.updated
    description: Triggered when calendar view data changes
    messages:
      calendarViewUpdated:
        $ref: '#/components/messages/CalendarViewUpdated'
  
  # RF-11: History and Audit Events
  reservation/history/created:
    address: reservation.history.created
    description: Triggered when history entry is created
    messages:
      reservationHistoryCreated:
        $ref: '#/components/messages/ReservationHistoryCreated'
  
  reservation/no_show:
    address: reservation.no_show
    description: Triggered when user doesn't show up
    messages:
      reservationNoShow:
        $ref: '#/components/messages/ReservationNoShow'
  
  audit/export/requested:
    address: audit.export.requested
    description: Triggered when audit export is requested
    messages:
      auditExportRequested:
        $ref: '#/components/messages/AuditExportRequested'

operations:
  # Publishers (Events sent by Availability Service)
  publishAvailabilityCreated:
    action: send
    channel:
      $ref: '#/channels/availability~1created'
    summary: Publish availability creation event
    description: Notifies other services when availability is created
  
  publishReservationCreated:
    action: send
    channel:
      $ref: '#/channels/reservation~1created'
    summary: Publish reservation creation event
    description: Notifies other services when reservation is created
  
  publishCalendarSyncCompleted:
    action: send
    channel:
      $ref: '#/channels/calendar~1sync~1completed'
    summary: Publish calendar sync completion
    description: Notifies when calendar synchronization completes
  
  publishHistoryCreated:
    action: send
    channel:
      $ref: '#/channels/reservation~1history~1created'
    summary: Publish history entry creation
    description: Notifies when audit history entry is created
  
  # Subscribers (Events received by Availability Service)
  subscribeResourceUpdated:
    action: receive
    channel:
      address: resource.updated
    summary: Handle resource updates
    description: Responds to resource changes from resource-service

components:
  messages:
    # RF-07 Messages
    AvailabilityCreated:
      name: AvailabilityCreated
      title: Availability Created Event
      summary: New availability slot created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AvailabilityCreatedPayload'
    
    ScheduleCreated:
      name: ScheduleCreated
      title: Schedule Created Event
      summary: Complex schedule created with rules
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ScheduleCreatedPayload'
    
    ReservationCreated:
      name: ReservationCreated
      title: Reservation Created Event
      summary: New reservation successfully created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationCreatedPayload'
    
    ReservationConflict:
      name: ReservationConflict
      title: Reservation Conflict Event
      summary: Conflict detected during reservation
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationConflictPayload'
    
    # RF-08 Messages
    CalendarIntegrationCreated:
      name: CalendarIntegrationCreated
      title: Calendar Integration Created
      summary: New calendar integration established
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CalendarIntegrationCreatedPayload'
    
    CalendarSyncCompleted:
      name: CalendarSyncCompleted
      title: Calendar Sync Completed
      summary: Calendar synchronization finished successfully
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CalendarSyncCompletedPayload'
    
    CalendarConflictsDetected:
      name: CalendarConflictsDetected
      title: Calendar Conflicts Detected
      summary: Conflicts found during calendar sync
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CalendarConflictsPayload'
    
    # RF-10 Messages
    CalendarViewRequested:
      name: CalendarViewRequested
      title: Calendar View Requested
      summary: User requested calendar view
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CalendarViewRequestedPayload'
    
    # RF-11 Messages
    ReservationHistoryCreated:
      name: ReservationHistoryCreated
      title: Reservation History Created
      summary: New audit history entry created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationHistoryCreatedPayload'
    
    ReservationNoShow:
      name: ReservationNoShow
      title: Reservation No Show
      summary: User failed to show up for reservation
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationNoShowPayload'

  schemas:
    # Common schemas
    BaseEvent:
      type: object
      required: [eventId, timestamp, serviceId, version]
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique event identifier
        timestamp:
          type: string
          format: date-time
          description: Event occurrence timestamp
        serviceId:
          type: string
          description: Service that generated the event
          example: "availability-service"
        version:
          type: string
          description: Event schema version
          example: "2.0.0"
        correlationId:
          type: string
          format: uuid
          description: Correlation ID for event tracing
        userId:
          type: string
          description: User who triggered the event
    
    # RF-07 Event Payloads
    AvailabilityCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [availabilityId, resourceId]
          properties:
            availabilityId:
              type: string
              description: Created availability ID
            resourceId:
              type: string
              description: Associated resource ID
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
            isRecurring:
              type: boolean
            metadata:
              type: object
              description: Additional availability metadata
    
    ReservationCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [reservationId, resourceId, userId]
          properties:
            reservationId:
              type: string
              description: Created reservation ID
            resourceId:
              type: string
              description: Reserved resource ID
            title:
              type: string
              description: Reservation title
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
            status:
              type: string
              enum: [CONFIRMED, PENDING, CANCELLED]
            requiresApproval:
              type: boolean
            attendees:
              type: array
              items:
                type: string
    
    ReservationConflictPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [conflictType, resourceId]
          properties:
            conflictType:
              type: string
              enum: [TIME_OVERLAP, RESOURCE_UNAVAILABLE, MAINTENANCE_WINDOW]
            resourceId:
              type: string
            conflictingReservations:
              type: array
              items:
                type: string
            suggestedAlternatives:
              type: array
              items:
                type: object
                properties:
                  startDate:
                    type: string
                    format: date-time
                  endDate:
                    type: string
                    format: date-time
                  resourceId:
                    type: string
    
    # RF-08 Event Payloads
    CalendarIntegrationCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [integrationId, provider, resourceId]
          properties:
            integrationId:
              type: string
              description: Created integration ID
            provider:
              type: string
              enum: [GOOGLE, OUTLOOK, ICAL, INTERNAL]
            resourceId:
              type: string
            name:
              type: string
              description: Integration name
            isActive:
              type: boolean
    
    CalendarSyncCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [integrationId, syncStatus]
          properties:
            integrationId:
              type: string
            syncStatus:
              type: string
              enum: [SUCCESS, PARTIAL, FAILED]
            eventsProcessed:
              type: integer
              description: Number of events processed
            conflictsDetected:
              type: integer
              description: Number of conflicts found
            syncDuration:
              type: integer
              description: Sync duration in milliseconds
            lastSyncDate:
              type: string
              format: date-time
    
    CalendarConflictsPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [integrationId, conflicts]
          properties:
            integrationId:
              type: string
            conflicts:
              type: array
              items:
                type: object
                properties:
                  externalEventId:
                    type: string
                  internalReservationId:
                    type: string
                  conflictType:
                    type: string
                    enum: [TIME_OVERLAP, DUPLICATE_EVENT, RESOURCE_MISMATCH]
                  severity:
                    type: string
                    enum: [LOW, MEDIUM, HIGH, CRITICAL]
                  resolutionStrategy:
                    type: string
                    enum: [EXTERNAL_WINS, INTERNAL_WINS, MANUAL_REVIEW]
    
    # RF-11 Event Payloads
    ReservationHistoryCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [historyId, reservationId, action, source]
          properties:
            historyId:
              type: string
              description: Created history entry ID
            reservationId:
              type: string
              description: Associated reservation ID
            action:
              type: string
              enum: [CREATED, UPDATED, CANCELLED, CONFIRMED, REJECTED, RESCHEDULED, CHECKED_IN, CHECKED_OUT, NO_SHOW]
            source:
              type: string
              enum: [USER, SYSTEM, ADMIN, API, CALENDAR_SYNC]
            hasDataChanges:
              type: boolean
              description: Whether data was modified
            details:
              type: string
              description: Additional action details
            ipAddress:
              type: string
              description: User IP address
    
    ReservationNoShowPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [reservationId, detectionMethod]
          properties:
            reservationId:
              type: string
            detectionMethod:
              type: string
              enum: [AUTOMATIC, MANUAL, SYSTEM_CHECK]
            gracePeriod:
              type: integer
              description: Grace period in minutes
            nextAction:
              type: string
              enum: [CANCEL_RESERVATION, MARK_NO_SHOW, NOTIFY_ADMIN]
    
    # Additional schemas for other events
    ScheduleCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            scheduleId:
              type: string
            scheduleType:
              type: string
              enum: [AVAILABLE, MAINTENANCE, BLOCKED, RESTRICTED]
            recurrenceRule:
              type: string
              description: RFC 5545 RRULE
    
    AvailabilityUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            availabilityId:
              type: string
            changes:
              type: object
              description: Changed fields
    
    ReservationApprovedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            reservationId:
              type: string
            approvedBy:
              type: string
            approvalReason:
              type: string
    
    ReservationCancelledPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            reservationId:
              type: string
            cancellationReason:
              type: string
            cancelledBy:
              type: string
    
    CalendarSyncInitiatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            integrationId:
              type: string
            syncType:
              type: string
              enum: [MANUAL, SCHEDULED, TRIGGERED]
    
    CalendarSyncFailedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            integrationId:
              type: string
            errorCode:
              type: string
            errorMessage:
              type: string
            retryCount:
              type: integer
    
    CalendarViewRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            viewType:
              type: string
              enum: [MONTH, WEEK, DAY, AGENDA]
            resourceIds:
              type: array
              items:
                type: string
            dateRange:
              type: object
              properties:
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
    
    CalendarViewUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            affectedResources:
              type: array
              items:
                type: string
            updateType:
              type: string
              enum: [REAL_TIME, SCHEDULED, MANUAL]
    
    AuditExportRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            exportFormat:
              type: string
              enum: [CSV, JSON, PDF]
            filters:
              type: object
              description: Applied export filters
            estimatedRecords:
              type: integer
