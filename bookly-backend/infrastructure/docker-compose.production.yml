# Docker Compose Override para PRODUCCIÓN
# Elimina exposición de puertos - TODO debe pasar por Nginx

services:
  # API Gateway - Comentar puerto para máxima seguridad
  # Solo accesible desde Nginx en la red interna
  api-gateway:
    ports: []  # NO exponer puerto al host
    # Para debugging temporal, descomentar:
    # ports:
    #   - "3000:3000"

  # Auth Service - NO exponer puerto
  auth-service:
    ports: []  # Solo accesible internamente

  # Resources Service - NO exponer puerto  
  resources-service:
    ports: []  # Solo accesible internamente

  # Availability Service - NO exponer puerto
  availability-service:
    ports: []  # Solo accesible internamente

  # Stockpile Service - NO exponer puerto
  stockpile-service:
    ports: []  # Solo accesible internamente

  # Reports Service - NO exponer puerto
  reports-service:
    ports: []  # Solo accesible internamente
