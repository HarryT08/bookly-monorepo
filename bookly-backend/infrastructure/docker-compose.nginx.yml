# Docker Compose para Nginx Reverse Proxy
# Punto de entrada único para bookly.com

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: bookly-nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      # SOLO estos puertos deben ser accesibles desde internet
      - "80:80"     # HTTP
      - "443:443"   # HTTPS
    volumes:
      # Configuración de Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      
      # Logs
      - nginx_logs:/var/log/nginx
      
      # Certificados SSL (Let's Encrypt)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    networks:
      - bookly-network
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Certbot para certificados SSL automáticos
  certbot:
    image: certbot/certbot:latest
    container_name: bookly-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  nginx_logs:
    driver: local

# IMPORTANTE: Esta red DEBE ser externa y compartida con microservicios
networks:
  bookly-network:
    external: true
    name: infrastructure_bookly-network
